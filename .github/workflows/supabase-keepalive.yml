name: Supabase Keep-Alive

on:
  schedule:
    # Run every 2 days at midnight UTC. A database WRITE (not a read) is what
    # resets Supabase's 7-day inactivity timer; every 2 days leaves margin even
    # if one run fails.
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database (write heartbeat)
        run: |
          curl -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            --retry 5 --retry-all-errors --retry-delay 30 \
            --fail-with-body

      - name: Log success
        if: success()
        run: echo "✅ Successfully pinged Supabase at $(date)"

      - name: Log failure
        if: failure()
        run: echo "❌ Failed to ping Supabase at $(date)"
